name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run lint
      - name: Unit tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Install Chromium for browser smoke test
        run: |
          npm install --prefix /tmp/cadet-browser-tools --no-package-lock playwright@1.65.1
          /tmp/cadet-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Telemetry pod browser smoke test
        env:
          PLAYWRIGHT_MODULE: /tmp/cadet-browser-tools/node_modules/playwright/index.mjs
        run: node scripts/verify-telemetry-pods.mjs
