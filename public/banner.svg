<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CADET-1 Orbital Telemetry Banner">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#080a12"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <!-- Telemetry grid pattern -->
    <pattern id="telemetryGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <path d="M40 0 L0 0 L0 40" stroke="#002244" stroke-width="0.5" fill="none"/>
      <circle cx="20" cy="20" r="1.5" fill="#003366"/>
    </pattern>

    <!-- Cyan glow for text -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle scanline pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#001122" opacity="0.15"/>
    </pattern>

    <!-- Orbit path gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0088CC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Satellite glow -->
    <radialGradient id="satGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="1"/>
      <stop offset="70%" stop-color="#0066AA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#003366" stop-opacity="0"/>
    </radialGradient>

    <!-- Thruster flame gradient -->
    <radialGradient id="flameGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="1"/>
      <stop offset="40%" stop-color="#00AACC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#004466" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>

  <!-- Telemetry grid background -->
  <rect width="1200" height="320" fill="url(#telemetryGrid)"/>

  <!-- Scanline overlay -->
  <rect width="1200" height="320" fill="url(#scanlines)" opacity="0.4"/>

  <!-- Major coordinate axes (subtle) -->
  <g stroke="#001133" stroke-width="0.5" opacity="0.6">
    <!-- Vertical grid lines -->
    <line x1="100" y1="40" x2="100" y2="280"/>
    <line x1="200" y1="40" x2="200" y2="280"/>
    <line x1="300" y1="40" x2="300" y2="280"/>
    <line x1="900" y1="40" x2="900" y2="280"/>
    <line x1="1000" y1="40" x2="1000" y2="280"/>
    <line x1="1100" y1="40" x2="1100" y2="280"/>
    <!-- Horizontal grid lines -->
    <line x1="60" y1="80" x2="1140" y2="80"/>
    <line x1="60" y1="160" x2="1140" y2="160"/>
    <line x1="60" y1="240" x2="1140" y2="240"/>
  </g>

  <!-- Coordinate labels (subtle) -->
  <g font-family="'JetBrains Mono', monospace" font-size="8" fill="#003366" opacity="0.5">
    <text x="95" y="35" text-anchor="middle">X</text>
    <text x="195" y="35" text-anchor="middle">Y</text>
    <text x="295" y="35" text-anchor="middle">Z</text>
    <text x="895" y="35" text-anchor="middle">-X</text>
    <text x="995" y="35" text-anchor="middle">-Y</text>
    <text x="1095" y="35" text-anchor="middle">-Z</text>
    <text x="50" y="84" text-anchor="end">100km</text>
    <text x="50" y="164" text-anchor="end">200km</text>
    <text x="50" y="244" text-anchor="end">300km</text>
  </g>

  <!-- LEFT: Wireframe Satellite / Orbital Craft -->
  <g transform="translate(120, 160)">
    <!-- Orbital trajectory ellipse -->
    <ellipse cx="0" cy="0" rx="85" ry="45" fill="none" stroke="url(#orbitGrad)" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="55" ry="28" fill="none" stroke="#00F0FF" stroke-width="0.8" stroke-dasharray="4,6" opacity="0.4"/>

    <!-- Planet body (central) -->
    <circle cx="0" cy="0" r="18" fill="url(#satGlow)" opacity="0.15"/>
    <circle cx="0" cy="0" r="16" fill="#050814" stroke="#00F0FF" stroke-width="1"/>
    <!-- Planet surface detail -->
    <ellipse cx="-3" cy="-2" rx="6" ry="4" fill="#003366" opacity="0.6"/>
    <ellipse cx="4" cy="3" rx="3" ry="2" fill="#0055AA" opacity="0.5"/>

    <!-- Satellite craft in orbit (position at 45 deg) -->
    <g transform="translate(60, -25)">
      <!-- Main bus -->
      <rect x="-8" y="-5" width="16" height="10" rx="1" fill="#0A0F1C" stroke="#00F0FF" stroke-width="1"/>
      <rect x="-6" y="-3" width="12" height="6" rx="0.5" fill="#00F0FF" opacity="0.1"/>
      <!-- Solar panels -->
      <rect x="-28" y="-2" width="22" height="4" rx="0.5" fill="url(#orbitGrad)" opacity="0.8"/>
      <rect x="6" y="-2" width="22" height="4" rx="0.5" fill="url(#orbitGrad)" opacity="0.8"/>
      <!-- Solar panel grid lines -->
      <g stroke="#00F0FF" stroke-width="0.3" opacity="0.6">
        <line x1="-26" y1="-2" x2="-26" y2="2"/>
        <line x1="-18" y1="-2" x2="-18" y2="2"/>
        <line x1="-10" y1="-2" x2="-10" y2="2"/>
        <line x1="8" y1="-2" x2="8" y2="2"/>
        <line x1="16" y1="-2" x2="16" y2="2"/>
        <line x1="24" y1="-2" x2="24" y2="2"/>
      </g>
      <!-- Antenna -->
      <line x1="0" y1="-5" x2="0" y2="-14" stroke="#00F0FF" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="0" cy="-14" r="2" fill="#FFB000"/>
      <!-- Thruster -->
      <ellipse cx="0" cy="5" rx="3" ry="6" fill="url(#flameGrad)" opacity="0.7"/>
    </g>

    <!-- Second satellite position (180 deg) -->
    <g transform="translate(-55, 20)">
      <rect x="-6" y="-4" width="12" height="8" rx="1" fill="#0A0F1C" stroke="#0066AA" stroke-width="0.8" opacity="0.6"/>
      <rect x="-20" y="-1.5" width="16" height="3" rx="0.5" fill="#0066AA" opacity="0.4"/>
      <rect x="4" y="-1.5" width="16" height="3" rx="0.5" fill="#0066AA" opacity="0.4"/>
    </g>

    <!-- Orbital markers / waypoints -->
    <g fill="#00F0FF" opacity="0.7">
      <circle cx="85" cy="0" r="3"/>
      <circle cx="-85" cy="0" r="3"/>
      <circle cx="0" cy="45" r="3"/>
      <circle cx="0" cy="-45" r="3"/>
    </g>

    <!-- Velocity vector indicator -->
    <g transform="translate(60, -25) rotate(20)">
      <path d="M0 0 L25 0" stroke="#FFB000" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.8"/>
      <text x="28" y="-2" font-family="'JetBrains Mono', monospace" font-size="7" fill="#FFB000">v⃗</text>
    </g>
  </g>

  <!-- Arrowhead marker for velocity vector -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FFB000"/>
    </marker>
  </defs>

  <!-- RIGHT: Typography Block -->
  <g transform="translate(400, 100)">
    <!-- Main Title -->
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="38" font-weight="700" fill="#FFFFFF" letter-spacing="2" filter="url(#cyanGlow)">
      CADET-1
    </text>
    <!-- Divider line -->
    <line x1="0" y1="12" x2="180" y2="12" stroke="#00F0FF" stroke-width="2" opacity="0.8"/>
    <text x="0" y="52" font-family="'JetBrains Mono', monospace" font-size="38" font-weight="700" fill="#00F0FF" letter-spacing="2">
      ORBITAL TELEMETRY
    </text>

    <!-- Subtitle -->
    <text x="0" y="100" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="400" fill="#A0B8D8" letter-spacing="3" text-transform="uppercase">
      3D REAL-TIME TRAJECTORY &amp; SUBSYSTEM SIMULATION ENGINE
    </text>

    <!-- Status badges row -->
    <g transform="translate(0, 130)">
      <g font-family="'JetBrains Mono', monospace" font-size="9" fill="#00F0FF">
        <!-- React badge -->
        <rect x="0" y="-8" width="56" height="16" rx="2" fill="#050814" stroke="#61DAFB" stroke-width="1"/>
        <text x="28" y="2" text-anchor="middle" font-size="8" fill="#61DAFB">REACT 19</text>

        <!-- Vite badge -->
        <rect x="64" y="-8" width="50" height="16" rx="2" fill="#050814" stroke="#FFD62E" stroke-width="1"/>
        <text x="89" y="2" text-anchor="middle" font-size="8" fill="#FFD62E">VITE</text>

        <!-- TypeScript badge -->
        <rect x="122" y="-8" width="60" height="16" rx="2" fill="#050814" stroke="#3178C6" stroke-width="1"/>
        <text x="152" y="2" text-anchor="middle" font-size="8" fill="#3178C6">TYPESCRIPT</text>

        <!-- Three.js badge -->
        <rect x="190" y="-8" width="58" height="16" rx="2" fill="#050814" stroke="#000000" stroke-width="1"/>
        <text x="219" y="2" text-anchor="middle" font-size="8" fill="#FFFFFF">THREE.JS</text>

        <!-- WebGL badge -->
        <rect x="256" y="-8" width="54" height="16" rx="2" fill="#050814" stroke="#990000" stroke-width="1"/>
        <text x="283" y="2" text-anchor="middle" font-size="8" fill="#FF6666">WEBGL2</text>
      </g>
    </g>

    <!-- Version / build info -->
    <text x="0" y="170" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4A5A7A">
      v1.0.0  •  MIT License  •  Production-Ready  •  Zero-Dependency Core Physics
    </text>
  </g>

  <!-- Bottom accent line with telemetry markers -->
  <g transform="translate(0, 290)">
    <line x1="400" y1="0" x2="1100" y2="0" stroke="#00F0FF" stroke-width="1" stroke-dasharray="20,10" opacity="0.4"/>
    <g font-family="'JetBrains Mono', monospace" font-size="7" fill="#003366" opacity="0.6">
      <text x="400" y="-4" text-anchor="middle">T-0</text>
      <text x="550" y="-4" text-anchor="middle">T+30s</text>
      <text x="700" y="-4" text-anchor="middle">T+60s</text>
      <text x="850" y="-4" text-anchor="middle">T+90s</text>
      <text x="1000" y="-4" text-anchor="middle">T+120s</text>
      <text x="1150" y="-4" text-anchor="middle">ORBIT</text>
    </g>
  </g>

  <!-- Corner brackets (brutalist framing) -->
  <g stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.4">
    <!-- Top-left -->
    <path d="M30 30 L30 50 L50 50"/>
    <!-- Top-right -->
    <path d="M1170 30 L1170 50 L1150 50"/>
    <!-- Bottom-left -->
    <path d="M30 290 L30 270 L50 270"/>
    <!-- Bottom-right -->
    <path d="M1170 290 L1170 270 L1150 270"/>
  </g>
</svg>
